<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>드론 중심투영 시뮬레이터</title><style>
:root{color-scheme:dark;--bg:#0d131b;--panel:#171f2a;--line:#2b3949;--ink:#e9f1f9;--muted:#93a5b7;--blue:#65b8ff;--amber:#f2bd67}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,'Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}button,input{font:inherit}#app{height:100%;display:flex;min-width:640px}aside{width:33%;min-width:235px;max-width:56%;display:flex;flex-direction:column;background:var(--panel);overflow:auto;scrollbar-width:thin}#split{width:7px;background:#0c1219;cursor:col-resize;flex:none;position:relative}#split:after{content:'';position:absolute;top:45%;height:10%;width:2px;left:2px;background:#66798b;border-radius:3px}main{flex:1;position:relative;min-width:260px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}section{padding:11px 14px;border-bottom:1px solid var(--line)}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;font-size:12px;color:#b8c7d6;font-weight:650;letter-spacing:.02em}.mini{height:175px;border:1px solid #334355;border-radius:8px;overflow:hidden;background:#101d27}.orbit{height:210px;border:1px solid #334355;border-radius:8px;overflow:hidden;background:#0d1923;cursor:grab}.orbit:active{cursor:grabbing}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.range{width:100%;accent-color:var(--blue);margin:10px 0 4px}.value{font-size:14px;color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}.stat{border:1px solid #304051;border-radius:7px;padding:9px 10px;background:#121b26}.label{color:var(--muted);font-size:11px;margin-bottom:4px}.num{font-size:16px;letter-spacing:.01em;font-weight:600;font-variant-numeric:tabular-nums}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.btn{cursor:pointer;padding:10px 4px;background:#223245;color:#eff7ff;border:1px solid #49617a;border-radius:7px;font-weight:700}.btn:hover{background:#30445a}.btn:active{background:#41607e}.sub{font-size:11px;color:var(--muted);font-weight:500}.checkline{display:flex;gap:8px;align-items:center;color:#c7d5e2;font-size:12px;margin-top:10px}.checkline input{accent-color:var(--blue)}#hud{position:absolute;left:18px;top:17px;right:18px;display:flex;justify-content:space-between;pointer-events:none;font-size:12px;font-weight:650;color:#e7f2fc;text-shadow:0 1px 5px #16222e}#hud span{background:#0d1822aa;padding:8px 10px;border:1px solid #ffffff22;border-radius:6px}.cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);pointer-events:none}.cross:before,.cross:after{content:"";position:absolute;background:#ffd39eaa}.cross:before{width:1px;height:22px;left:10px}.cross:after{height:1px;width:22px;top:10px}#bottom{position:absolute;bottom:18px;right:18px;color:#dce9f4;background:#0d1822bb;border:1px solid #ffffff22;border-radius:6px;padding:7px 10px;font-size:12px;pointer-events:none}#cam{background:#718f7c}.foot{padding-top:10px;padding-bottom:12px}.tiny{font-size:11px;color:#96aabc;line-height:1.7}.mono{font-variant-numeric:tabular-nums} @media(max-width:720px){aside{min-width:215px}section{padding:9px}.mini{height:145px}.orbit{height:160px}}
</style></head><body><div id="app"><aside id="panel"><section><div class="head">탑뷰 미니맵 <span class="sub">O / P</span></div><div class="mini"><canvas id="map"></canvas></div></section><section><div class="head">3D 조감도 <button class="btn" id="resetOrbit" style="padding:4px 9px;font-size:11px">시점 초기화</button></div><div class="orbit" id="orbitHost"><canvas id="orbit"></canvas></div><label class="checkline"><input type="checkbox" id="showFrustum" checked>촬영 범위 · 투영광선</label><label class="checkline"><input type="checkbox" id="showFootprint" checked>카메라 화면에 건물 바닥 윤곽</label></section><section><div class="head"><label for="height">건물 높이</label><span class="value"><span id="heightText">12</span> m</span></div><input class="range" id="height" type="range" min="0" max="30" value="12" step="1"></section><section><div class="head">드론 위치</div><div class="stats"><div class="stat"><div class="label">고도</div><div class="num"><span id="zText">40.0</span> m</div></div><div class="stat"><div class="label">카메라 방향</div><div class="num">−90°</div></div><div class="stat"><div class="label">X</div><div class="num"><span id="xText">−18.0</span> m</div></div><div class="stat"><div class="label">Y</div><div class="num"><span id="yText">0.0</span> m</div></div></div></section><section class="foot"><div class="head">관측점</div><div class="actions"><button class="btn" id="goO">O <span class="sub">이동</span></button><button class="btn" id="goP">P <span class="sub">이동</span></button><button class="btn" id="reset">R <span class="sub">초기화</span></button></div><div class="tiny" style="margin-top:10px">← ↑ ↓ → 수평 이동　·　W / S 상승·하강<br>O / P 관측점 이동　·　R 초기화</div></section></aside><div id="split" title="대시보드 너비 조절"></div><main id="main"><canvas id="cam"></canvas><div id="hud"><span>CAM 01 · NADIR</span><span>FOV 70°</span></div><div class="cross"></div><div id="bottom" class="mono">H <span id="camZ">40.0</span> m</div></main></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), panel=$('panel'),main=$('main');
const canvases={map:$('map'),orbit:$('orbit'),cam:$('cam')};const ctx=Object.fromEntries(Object.entries(canvases).map(([k,c])=>[k,c.getContext('2d')]));
const state={x:-18,y:0,z:40,h:12,fov:70,ox:0,oy:0,orbitYaw:-.77,orbitPitch:.61,orbitDist:91,frustum:true,footprint:true};
const PTS={O:{x:-18,y:0,z:40},P:{x:18,y:0,z:40}};const keys=new Set();let last=0,dirty=true;
function resize(){for(let k in canvases){const c=canvases[k],r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);const w=Math.max(1,Math.round(r.width*d)),h=Math.max(1,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}ctx[k].setTransform(d,0,0,d,0,0);}dirty=true;}
const V=(x,y,z)=>({x,y,z}),sub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z),dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,cross=(a,b)=>V(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x),norm=a=>{let d=Math.hypot(a.x,a.y,a.z)||1;return V(a.x/d,a.y/d,a.z/d)},add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z),mul=(a,t)=>V(a.x*t,a.y*t,a.z*t);
function observer(){let {orbitYaw:y,orbitPitch:p,orbitDist:d}=state,target=V(0,0,5);let eye=V(d*Math.cos(p)*Math.cos(y),d*Math.cos(p)*Math.sin(y),d*Math.sin(p)+7);let f=norm(sub(target,eye)),right=norm(cross(f,V(0,0,1))),up=norm(cross(right,f));return {eye,f,right,up};}
function makeProj(which,w,h){if(which==='cam'){let cx=state.x,cy=state.y,H=state.z;let focal=h/(2*Math.tan(state.fov*Math.PI/360));return p=>{let depth=H-p.z;if(depth<=.15)return null;return {x:w/2+(p.x-cx)*focal/depth,y:h/2-(p.y-cy)*focal/depth,depth};};}let o=observer(),focal=h/(2*Math.tan(57*Math.PI/360));return p=>{let d=sub(p,o.eye),dep=dot(d,o.f);if(dep<=.15)return null;return{x:w/2+dot(d,o.right)*focal/dep,y:h/2-dot(d,o.up)*focal/dep,depth:dep};};}
function line(g,proj,pts,color,width=1,dash=[]){let p=pts.map(proj);if(p.some(v=>!v))return;g.strokeStyle=color;g.lineWidth=width;g.setLineDash(dash);g.beginPath();p.forEach((q,i)=>i?g.lineTo(q.x,q.y):g.moveTo(q.x,q.y));g.stroke();g.setLineDash([]);}
function poly(g,proj,pts,fill,stroke=null,width=1,dash=[]){let p=pts.map(proj);if(p.some(v=>!v))return;g.beginPath();p.forEach((q,i)=>i?g.lineTo(q.x,q.y):g.moveTo(q.x,q.y));g.closePath();if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=width;g.setLineDash(dash);g.stroke();g.setLineDash([]);}}
function boxGeom(x0,y0,x1,y1,H){let b=[V(x0,y0,0),V(x1,y0,0),V(x1,y1,0),V(x0,y1,0)],t=b.map(q=>V(q.x,q.y,H));return{b,t};}
const building=()=>boxGeom(-7,-6,7,6,state.h);
function drawGround(g,proj,which){if(which==='cam'){g.fillStyle='#718b78';g.fillRect(0,0,g.canvas.clientWidth,g.canvas.clientHeight);}else{g.fillStyle='#101f2d';g.fillRect(0,0,g.canvas.clientWidth,g.canvas.clientHeight);poly(g,proj,[V(-65,-65,0),V(65,-65,0),V(65,65,0),V(-65,65,0)],'#6d8875','#9bb2a1');}
 for(let n=-60;n<=60;n+=5){let major=n%20===0;line(g,proj,[V(n,-65,.02),V(n,65,.02)],major?'#d3dfd055':'#d5dfd024',major?1.2:.7);line(g,proj,[V(-65,n,.02),V(65,n,.02)],major?'#d3dfd055':'#d5dfd024',major?1.2:.7);}line(g,proj,[V(-65,0,.05),V(65,0,.05)],'#d7e6d187',1.1);line(g,proj,[V(0,-65,.05),V(0,65,.05)],'#d7e6d187',1.1);
 for(const [name,p] of Object.entries(PTS)){let q=proj(V(p.x,p.y,.08));if(!q)continue;g.fillStyle='#eaf4ff';g.strokeStyle='#276d9b';g.lineWidth=2.5;g.beginPath();g.arc(q.x,q.y,7,0,Math.PI*2);g.fill();g.stroke();g.fillStyle='#134e76';g.font='bold 10px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(name,q.x,q.y+.4);}}
function drawBuilding(g,proj,which){let {b,t}=building();if(state.h<.05){poly(g,proj,b,'#83acb8','#395d6e',2);return;}
 let faces=[{v:[b[0],b[1],t[1],t[0]],c:'#86a5b7'},{v:[b[1],b[2],t[2],t[1]],c:'#607e93'},{v:[b[2],b[3],t[3],t[2]],c:'#7694a6'},{v:[b[3],b[0],t[0],t[3]],c:'#9bb9c7'}];
 // Draw only outward-facing walls, in correct depth order.
 let eye=which==='cam'?V(state.x,state.y,state.z):observer().eye;
 let normals=[V(0,-1,0),V(1,0,0),V(0,1,0),V(-1,0,0)];
 faces=faces.filter((f,i)=>dot(normals[i],sub(eye,f.v[0]))>0);
 faces.sort((a,b)=>{const dist=f=>f.v.reduce((s,v)=>s+Math.hypot(v.x-eye.x,v.y-eye.y,v.z-eye.z),0)/4;return dist(b)-dist(a)});
 for(let f of faces)poly(g,proj,f.v,f.c,'#416276',1.4);
 poly(g,proj,t,'#b9d1dc','#436b80',2);
 // roof seams
 let a=V(-7,0,state.h+.025),z=V(7,0,state.h+.025);line(g,proj,[a,z],'#6b95a9',1);
 if(which==='cam'&&state.footprint){poly(g,proj,b,null,'#ffda8b',2,[6,5]);for(let i=0;i<4;i++)line(g,proj,[b[i],t[i]],'#ffd58fbb',1.5,[4,5]);}}
function drawDrone(g,proj){let p=V(state.x,state.y,state.z);let arms=[[V(-2,0,0),V(2,0,0)],[V(0,-2,0),V(0,2,0)]];for(let [a,b]of arms)line(g,proj,[add(p,a),add(p,b)],'#263d52',4);for(let [dx,dy] of [[-2,0],[2,0],[0,-2],[0,2]]){let q=proj(add(p,V(dx,dy,0)));if(q){g.beginPath();g.ellipse(q.x,q.y,5,3,0,0,Math.PI*2);g.fillStyle='#e3eef5';g.fill();g.strokeStyle='#324d62';g.lineWidth=1.8;g.stroke();}}
 let q=proj(p);if(q){g.beginPath();g.arc(q.x,q.y,5,0,Math.PI*2);g.fillStyle='#2b4d68';g.fill();g.strokeStyle='#f4c479';g.lineWidth=2;g.stroke();}}
function footprint(){let h=state.z,ang=state.fov*Math.PI/360,halfY=h*Math.tan(ang/2),aspect=canvases.cam.clientWidth/Math.max(1,canvases.cam.clientHeight),halfX=halfY*aspect;return[V(state.x-halfX,state.y-halfY,0),V(state.x+halfX,state.y-halfY,0),V(state.x+halfX,state.y+halfY,0),V(state.x-halfX,state.y+halfY,0)];}
function drawOrbit(){let c=canvases.orbit,g=ctx.orbit,w=c.clientWidth,h=c.clientHeight;g.clearRect(0,0,w,h);let proj=makeProj('orbit',w,h);drawGround(g,proj,'orbit');let pts=footprint(),camera=V(state.x,state.y,state.z);if(state.frustum){poly(g,proj,pts,'#ebbf6e18','#e9b96a',1.5,[5,4]);for(let p of pts)line(g,proj,[camera,p],'#f0be76ba',1.2);line(g,proj,[camera,V(state.x,state.y,0)],'#8ed9ff',1.2,[4,4]);}drawBuilding(g,proj,'orbit');drawDrone(g,proj);}
function drawCamera(){let c=canvases.cam,g=ctx.cam,w=c.clientWidth,h=c.clientHeight;g.clearRect(0,0,w,h);let proj=makeProj('cam',w,h);drawGround(g,proj,'cam');drawBuilding(g,proj,'cam');}
function drawMap(){let c=canvases.map,g=ctx.map,w=c.clientWidth,h=c.clientHeight;g.clearRect(0,0,w,h);g.fillStyle='#12212d';g.fillRect(0,0,w,h);let s=Math.min(w/110,h/100),X=x=>w/2+x*s,Y=y=>h/2-y*s;
for(let n=-50;n<=50;n+=10){g.strokeStyle=n%20===0?'#66809470':'#5a708040';g.lineWidth=1;g.beginPath();g.moveTo(X(n),0);g.lineTo(X(n),h);g.moveTo(0,Y(n));g.lineTo(w,Y(n));g.stroke();}
// Camera ground footprint
const foot=footprint();g.fillStyle='#e2b46819';g.strokeStyle='#e6b86c';g.lineWidth=1;g.setLineDash([5,4]);g.beginPath();foot.forEach((p,i)=>i?g.lineTo(X(p.x),Y(p.y)):g.moveTo(X(p.x),Y(p.y)));g.closePath();g.fill();g.stroke();g.setLineDash([]);
g.fillStyle='#8fa8b8';g.strokeStyle='#c1d6e2';g.lineWidth=1.5;g.fillRect(X(-7),Y(6),14*s,12*s);g.strokeRect(X(-7),Y(6),14*s,12*s);
for(let [name,p]of Object.entries(PTS)){let x=X(p.x),y=Y(p.y);g.fillStyle='#2b82ba';g.strokeStyle='#e8f7ff';g.lineWidth=1.5;g.beginPath();g.arc(x,y,8,0,Math.PI*2);g.fill();g.stroke();g.font='bold 10px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillStyle='white';g.fillText(name,x,y+.5);}
let x=X(state.x),y=Y(state.y);g.strokeStyle='#fff5d9';g.lineWidth=2;g.beginPath();g.arc(x,y,6,0,Math.PI*2);g.stroke();g.fillStyle='#f3a74a';g.beginPath();g.moveTo(x,y-11);g.lineTo(x-5,y+5);g.lineTo(x+5,y+5);g.closePath();g.fill();}
function ui(){ $('xText').textContent=state.x.toFixed(1);$('yText').textContent=state.y.toFixed(1);$('zText').textContent=state.z.toFixed(1);$('camZ').textContent=state.z.toFixed(1);$('heightText').textContent=state.h.toFixed(0);}
function render(){resize();drawMap();drawOrbit();drawCamera();ui();dirty=false;}
function jump(k){Object.assign(state,PTS[k]);dirty=true;}
$('goO').onclick=()=>jump('O');$('goP').onclick=()=>jump('P');$('reset').onclick=()=>{Object.assign(state,{...PTS.O,h:12});$('height').value=12;dirty=true;};$('height').oninput=e=>{state.h=Number(e.target.value);state.z=Math.max(state.z,state.h+4);dirty=true;};$('showFrustum').onchange=e=>{state.frustum=e.target.checked;dirty=true;};$('showFootprint').onchange=e=>{state.footprint=e.target.checked;dirty=true;};$('resetOrbit').onclick=()=>{Object.assign(state,{orbitYaw:-.77,orbitPitch:.61,orbitDist:91});dirty=true;};
const moveKeys=new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','w','W','s','S']);
window.addEventListener('keydown',e=>{if(e.target instanceof HTMLInputElement)return;if(moveKeys.has(e.key)){e.preventDefault();keys.add(e.key.toLowerCase());}else if(!e.repeat){if(e.key.toLowerCase()==='o')jump('O');if(e.key.toLowerCase()==='p')jump('P');if(e.key.toLowerCase()==='r')$('reset').click();}});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());
const orbitHost=$('orbitHost');let drag=null;orbitHost.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,button:e.button};orbitHost.setPointerCapture(e.pointerId);});orbitHost.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;if(drag.button===0){state.orbitYaw-=dx*.009;state.orbitPitch=Math.max(.12,Math.min(1.46,state.orbitPitch+dy*.007));}else{state.orbitYaw-=dx*.004;state.orbitPitch=Math.max(.12,Math.min(1.46,state.orbitPitch+dy*.003));}dirty=true;});orbitHost.addEventListener('pointerup',()=>drag=null);orbitHost.addEventListener('pointercancel',()=>drag=null);orbitHost.addEventListener('contextmenu',e=>e.preventDefault());orbitHost.addEventListener('wheel',e=>{e.preventDefault();state.orbitDist=Math.max(28,Math.min(190,state.orbitDist*Math.exp(e.deltaY*.001)));dirty=true;},{passive:false});
let splitDrag=false;$('split').addEventListener('pointerdown',e=>{splitDrag=true;$('split').setPointerCapture(e.pointerId);});$('split').addEventListener('pointermove',e=>{if(!splitDrag)return;let left=Math.max(235,Math.min(window.innerWidth*.56,e.clientX));panel.style.width=left+'px';dirty=true;});$('split').addEventListener('pointerup',()=>splitDrag=false);$('split').addEventListener('pointercancel',()=>splitDrag=false);
function frame(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;let dx=(keys.has('arrowright')?1:0)-(keys.has('arrowleft')?1:0),dy=(keys.has('arrowup')?1:0)-(keys.has('arrowdown')?1:0),dz=(keys.has('w')?1:0)-(keys.has('s')?1:0);if(dx||dy||dz){let length=Math.hypot(dx,dy)||1;state.x=Math.max(-52,Math.min(52,state.x+dx/length*11*dt));state.y=Math.max(-52,Math.min(52,state.y+dy/length*11*dt));state.z=Math.max(state.h+4,Math.min(95,state.z+dz*9*dt));dirty=true;}if(dirty)render();requestAnimationFrame(frame);}window.addEventListener('resize',()=>dirty=true);new ResizeObserver(()=>dirty=true).observe(main);new ResizeObserver(()=>dirty=true).observe(panel);requestAnimationFrame(frame);
})();
</script></body></html>
